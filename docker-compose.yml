name: kiln-gas-load
x-kiln: &kiln
  build: ./backend
  image: kiln-gas-load-python:local
  environment:
    DATABASE_URL: postgresql://kiln:${DB_PASSWORD:-kiln_local_only}@db/kiln
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-kiln-demo-example-key-change-before-deployment-731}
    SEED_DEMO: ${SEED_DEMO:-true}
    OPENBLAS_NUM_THREADS: '1'
  volumes:
    - artifacts:/artifacts
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
services:
  frontend:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-gas-load}-frontend
    ports: ['${FRONTEND_PORT:-18272}:80']
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/health']
      interval: 3s
      timeout: 3s
      retries: 10
  backend:
    <<: *kiln
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-gas-load}-backend
    command: [sh, -c, 'if [ "$${SEED_DEMO}" = true ]; then python -m scripts.seed_demo || echo "seed failed" >&2; fi; exec uvicorn kiln.app:app --host 0.0.0.0 --port 8000']
    ports: ['${BACKEND_PORT:-19272}:8000']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
      interval: 3s
      timeout: 3s
      retries: 15
  worker:
    <<: *kiln
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-gas-load}-worker
    command: [python, -m, kiln.worker]
    healthcheck:
      test: [CMD, python, -c, 'import pathlib,time; assert time.time()-pathlib.Path("/tmp/kiln-heartbeat").stat().st_mtime < 25']
      interval: 3s
      timeout: 3s
      retries: 15
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-gas-load}-db
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kiln_local_only}
      POSTGRES_DB: kiln
    ports: ['${DB_PORT:-17772}:5432']
    volumes:
      - database:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U kiln -d kiln && PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U kiln -d kiln -Atqc "select count(*) from firing_batches"']
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-gas-load}-redis
    command: [redis-server, --appendonly, 'yes']
    volumes: [cache:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  database:
  cache:
  artifacts:
